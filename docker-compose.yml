version: '3.8'

services:
  # --- PostgreSQL 16 Primary Relational Database ---
  db:
    image: postgres:16-alpine
    container_name: academic_portal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-academic_portal}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-academic_portal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis 7 In-Memory Cache & Queue Broker ---
  redis:
    image: redis:7-alpine
    container_name: academic_portal_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Academic Portal Application (Server + Single Page App) ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: academic_portal_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-academic_portal}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENABLE_REDIS=true
      - JWT_SECRET=${JWT_SECRET:-production-jwt-secret-replace-in-env-file-2026}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - MOCK_NOTIFICATIONS=${MOCK_NOTIFICATIONS:-true}

volumes:
  pgdata:
  redisdata:
