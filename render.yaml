services:
  - type: web
    name: vsb-academic-portal
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MOCK_NOTIFICATIONS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: vsb-academic-portal-db
          property: connectionString

databases:
  - name: vsb-academic-portal-db
    plan: free
    region: singapore
    databaseName: academic_portal
    user: portal_admin
